services:
  # Backend API Service
  - type: web
    name: aviator-analytics-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/app.db
      - key: JWT_SECRET
        generateValue: true
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/dashboard/stats
    autoDeploy: true
